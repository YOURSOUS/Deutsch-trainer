<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>页面不存在 · 德语自适应学习小站</title>
<style>
  :root {
    --p: #7C5CFF;
    --p-deep: #5B3FD6;
    --bg: #F6F4FF;
    --card: #FFFFFF;
    --text: #1E1B33;
    --text-dim: #6B6885;
    --border: #DCD2FA;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --p: #9B7BFF;
      --p-deep: #7C5CFF;
      --bg: #14101F;
      --card: #1E1930;
      --text: #EDEAF7;
      --text-dim: #A8A2C4;
      --border: #322A4A;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: "YouYuan", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .box {
    width: min(440px, 100%);
    padding: 30px 26px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(124, 92, 255, .12);
  }
  .code {
    font-size: 46px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--p), var(--p-deep));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  h1 { margin: 14px 0 8px; font-size: 17px; }
  p { margin: 0 0 20px; font-size: 13px; line-height: 1.7; color: var(--text-dim); }
  a {
    display: inline-block;
    padding: 10px 22px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--p), var(--p-deep));
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(124, 92, 255, .3);
  }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>链接可能已失效，或该路径不允许直接访问。<br>回到首页继续学习吧。</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
