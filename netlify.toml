# ============================================================================
# 德语学习站 · Netlify 部署配置
# 纯静态站点：无构建命令、无云函数，仓库根目录即发布目录。
#
# ⚠️ 本文件必须保留，删掉会导致两个问题：
#   1) publish = "." 是显式声明。删掉本文件后，Netlify 会回退到站点后台 UI 的
#      默认设置；一旦 UI 里没配发布目录，线上会直接 404。
#   2) 下面 [[redirects]] 里的 404 封锁，是"_archive 历史备份不外泄"的唯一
#      强制手段——它对"整包拖拽上传"这种不经过 Git 的部署方式同样生效。
#      （.gitignore 只能挡住 Git 提交，挡不住手动上传。）
# ============================================================================

[build]
  publish = "."

# 纯静态站点，已不再包含任何云函数。
# 原 [functions] 段落已移除——目录不存在时保留该配置会让部署日志报错告警。
# 原 [build.environment] NODE_VERSION 也一并移除——没有 Node 构建步骤了。

# ---------------------------------------------------------------------------
# 安全封锁：以下路径一律返回 404，禁止公网访问
# force = true 必须加，否则已存在的静态文件会"影子化"掉这条规则
# ---------------------------------------------------------------------------

# 1) 历史版本备份（21 个 index_*.html，含早期 bug 与调试痕迹）
[[redirects]]
  from = "/_archive/*"
  to = "/404.html"
  status = 404
  force = true

# 2) 编辑器与虚拟环境残留（.idea 可能含本地绝对路径与配置，.venv 是 Python 虚拟环境）
[[redirects]]
  from = "/.idea/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.venv/*"
  to = "/404.html"
  status = 404
  force = true

# 3) 工作区记忆文件（协作过程记录，不属于站点内容）
[[redirects]]
  from = "/.workbuddy/*"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# 基础安全响应头
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
